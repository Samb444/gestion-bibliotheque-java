<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Country Explorer - Découvrez et explorez les pays du monde simplement.">
  <title>Country Explorer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-container">
        <h1 class="app-title">Country Explorer</h1>
        <p class="app-subtitle">Découvrez les pays du monde simplement.</p>
      </div>
    </header>

    <main class="app-main">
      <section class="explorer-section" aria-labelledby="section-title">
        <div class="section-header">
          <h2 id="section-title">Explorer les pays</h2>
          <p id="results-count" class="results-count" aria-live="polite"></p>
        </div>

        <!-- Zone de recherche et de filtres (visuelle, non connectée en Phase 2) -->
        <div class="controls-container">
          <form id="search-form" class="search-form" role="search">
            <div class="form-group search-group">
              <label for="search-input" class="form-label">Rechercher un pays :</label>
              <div class="search-input-wrapper">
                <input
                  type="search"
                  id="search-input"
                  name="search"
                  class="form-input"
                  placeholder="Ex: France, Sénégal, Japon..."
                  autocomplete="off"
                >
                <button type="submit" id="search-button" class="btn btn-primary">
                  Rechercher
                </button>
              </div>
            </div>

            <div class="form-group filter-group">
              <label for="region-filter" class="form-label">Filtrer par région :</label>
              <select id="region-filter" name="region" class="form-select">
                <option value="">Toutes les régions</option>
                <option value="Africa">Afrique</option>
                <option value="Americas">Amériques</option>
                <option value="Asia">Asie</option>
                <option value="Europe">Europe</option>
                <option value="Oceania">Océanie</option>
              </select>
            </div>
          </form>
        </div>

        <!-- Zone d'état : Chargement (masquée par défaut, gérée en JS) -->
        <div id="loading" class="status-box loading-box hidden" role="status" aria-live="polite">
          <span class="loading-spinner" aria-hidden="true"></span>
          <span>Chargement des pays...</span>
        </div>

        <!-- Zone d'état : Erreur (masquée par défaut, gérée en JS) -->
        <div id="error-message" class="status-box error-box hidden" role="alert">
          <span class="error-icon" aria-hidden="true">⚠️</span>
          <span>Une erreur est survenue lors du chargement des pays.</span>
        </div>

        <!-- Zone d'état : Aucun résultat (masquée par défaut, gérée en JS) -->
        <div id="empty-state" class="status-box empty-box hidden" role="status" aria-live="polite">
          <span class="empty-icon" aria-hidden="true">🔍</span>
          <span>Aucun pays disponible.</span>
        </div>

        <!-- Zone d'affichage des résultats -->
        <section id="countries-container" class="countries-grid" aria-live="polite">
        </section>
      </section>
    </main>

    <footer class="app-footer">
      <div class="footer-container">
        <p>Country Explorer — Exercice 4 Java / Web</p>
      </div>
    </footer>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
