# ==============================================================================
# PROJET : API REST Gestion d'une Salle de Sport (Exercice 5)
# PHASE 1 : Architecture technique initiale
# ==============================================================================

# --- Configuration du Serveur HTTP ---
server.port=8080
server.servlet.context-path=

# --- Configuration de la Source de Données MySQL ---
# Utilisation de variables d'environnement avec valeurs par défaut de développement local.
# Aucun mot de passe ni identifiant secret n'est figé en dur.
# Variables personnalisables : DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:salle_sport}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuration du Pool de Connexion HikariCP ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# --- Configuration Spring Data JPA / Hibernate ---
# En Phase 1, aucune entité métier n'est encore définie ; ddl-auto reste à 'none'
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
